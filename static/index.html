<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisPay AI | Live Risk Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard-container">
        <header>
            <div class="logo">
                <span class="shield-icon">🛡️</span> AEGISPAY <span class="highlight">AI</span>
            </div>
            <div class="status-badge">
                <span class="pulse"></span> LIVE MONITORING ACTIVE
            </div>
        </header>

        <!-- Metrics Overview -->
        <section class="metrics-grid">
            <div class="card">
                <h3>TOTAL EVALUATED</h3>
                <p id="stat-total" class="metric-val">0</p>
            </div>
            <div class="card alert-card">
                <h3>HIGH RISK / FRAUD</h3>
                <p id="stat-fraud" class="metric-val">0</p>
            </div>
            <div class="card warning-card">
                <h3>CHALLENGED (PUSH)</h3>
                <p id="stat-challenge" class="metric-val">0</p>
            </div>
            <div class="card">
                <h3>AVG LATENCY</h3>
                <p id="stat-latency" class="metric-val">0.0 ms</p>
            </div>
        </section>

        <!-- Main Layout Split -->
        <div class="main-split">
            <!-- Left: Quick Simulation Panel -->
            <section class="panel sim-panel">
                <h2>⚡ TEST TRANSACTION</h2>
                <form id="sim-form">
                    <label>Amount (₹)</label>
                    <input type="number" id="sim-amount" value="250.00" step="0.01">

                    <label>Account ID</label>
                    <input type="text" id="sim-account" value="acc_usr_9981">

                    <label>Merchant ID</label>
                    <input type="text" id="sim-merchant" value="merch_tech_store">

                    <label>IP Address</label>
                    <input type="text" id="sim-ip" value="192.168.1.45">

                    <button type="submit" id="btn-send">SEND EVALUATION REQUEST</button>
                </form>
            </section>

            <!-- Right: Real-time Live Stream Feed -->
            <section class="panel feed-panel">
                <h2>📡 LIVE TRANSACTION STREAM</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>EVAL ID</th>
                                <th>ACCOUNT</th>
                                <th>AMOUNT</th>
                                <th>RISK SCORE</th>
                                <th>VERDICT</th>
                                <th>LATENCY</th>
                            </tr>
                        </thead>
                        <tbody id="stream-rows">
                            <tr class="empty-row">
                                <td colspan="6">Waiting for incoming transaction events...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
